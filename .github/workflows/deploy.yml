name: Deploy backend to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.12'
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: ${{ vars.AZURE_APP_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Compile backend
        run: python -m py_compile app.py

      - name: Check for storage secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.pyc' \
            'CONNECTION_STRING|AccountKey|account_key|storage_account_key' .; then
            echo "Storage connection strings or keys are not allowed."
            exit 1
          fi

  deploy:
    name: Deploy infrastructure and app
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters \
                appName="$APP_NAME" \
                storageAccountName="$STORAGE_ACCOUNT_NAME" \
                frontendOrigin="$FRONTEND_ORIGIN"

      - name: Deploy Python application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
